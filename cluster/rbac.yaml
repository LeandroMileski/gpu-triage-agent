apiVersion: v1
kind: Namespace
metadata:
  name: debugger
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: debugger-agent
  namespace: debugger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debugger-agent
  namespace: k8s-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debugger-agent
  namespace: k8s-lab
subjects:
  - kind: ServiceAccount
    name: debugger-agent
    namespace: debugger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: debugger-agent
