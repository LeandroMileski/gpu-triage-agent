# Cluster name and node role are hardcoded to the Terraform defaults.
# Change both here if you change var.cluster_name.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  # al2023@latest resolves to the EKS accelerated AMI on g5 and g6.
  # That AMI already contains the NVIDIA driver and the container toolkit.
  amiSelectorTerms:
    - alias: al2023@latest
  role: k8s-debug-demo
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 40Gi
        volumeType: gp3
        deleteOnTermination: true
        encrypted: true
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: k8s-debug-demo
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: k8s-debug-demo
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-inference
spec:
  limits:
    cpu: "8"
    nvidia.com/gpu: "1"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  template:
    metadata:
      labels:
        # The device plugin's default affinity selects this label.
        nvidia.com/gpu.present: "true"
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6.xlarge", "g5.xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
