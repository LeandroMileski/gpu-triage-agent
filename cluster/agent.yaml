apiVersion: batch/v1
kind: CronJob
metadata:
  name: triage-agent
  namespace: triage
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: triage-agent
          restartPolicy: Never
          nodeSelector:
            workload: system
          containers:
            - name: triage
              image: triage-agent
              imagePullPolicy: Always
              env:
                - name: LLM_BASE_URL
                  value: http://vllm.llm.svc.cluster.local:8000/v1
                - name: LLM_MODEL
                  value: Qwen/Qwen2.5-7B-Instruct-AWQ
                - name: GPU_USD_PER_HOUR
                  value: "0.50"
                - name: API_USD_PER_MILLION_TOKENS
                  value: "0.15"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
