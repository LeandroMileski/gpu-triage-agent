apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab
  namespace: k8s-lab
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: k8s-lab
data:
  present: "yes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop
  template:
    metadata:
      labels:
        app: crashloop
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "OPENAI_API_KEY=sk-fake-demo-key-1234567890"
              echo "starting crashloop"
              if [ -z "$REQUIRED_SETTING" ]; then
                echo "missing REQUIRED_SETTING"
                exit 1
              fi
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oomkilled
  namespace: k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oomkilled
  template:
    metadata:
      labels:
        app: oomkilled
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-c", "bytearray(200_000_000)"]
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull
  namespace: k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagepull
  template:
    metadata:
      labels:
        app: imagepull
    spec:
      containers:
        - name: app
          image: busybox:this-tag-does-not-exist-demo
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-error
  namespace: k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-error
  template:
    metadata:
      labels:
        app: config-error
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
            - name: MISSING
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: does-not-exist
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: failing-probe
  namespace: k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: failing-probe
  template:
    metadata:
      labels:
        app: failing-probe
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: missing-class
  namespace: k8s-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: does-not-exist
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-pvc
  namespace: k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-pvc
  template:
    metadata:
      labels:
        app: pending-pvc
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: missing-class
